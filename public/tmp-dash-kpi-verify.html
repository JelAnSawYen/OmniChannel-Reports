<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Dashboard KPI verify</title>
    <link rel="stylesheet" href="/build/assets/app-BV1j6WbT.css">
</head>
<body data-page="dashboard">
<div class="dashboard-home" style="padding:24px;max-width:1200px;margin:0 auto;">
    <div class="dash-kpis">
        <div class="dash-kpi dash-kpi-orange dash-kpi-sims">
            <span class="dash-kpi-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 5.5A2.5 2.5 0 0 1 8.5 3h4.7L18 7.8v10.7A2.5 2.5 0 0 1 15.5 21h-7A2.5 2.5 0 0 1 6 18.5v-13z"/></svg>
            </span>
            <div class="dash-kpi-body">
                <span class="dash-kpi-label">Total SIMs</span>
                <div class="dash-kpi-value">3</div>
                <div class="dash-sim-inline">
                    <span>Globe</span> <strong>2</strong>
                    <span class="dash-sim-sep">|</span>
                    <span>Smart</span> <strong>1</strong>
                </div>
            </div>
        </div>
        <div class="dash-kpi dash-kpi-pink" id="defective-card">
            <span class="dash-kpi-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.4 4.3 3 17.4A1.8 1.8 0 0 0 4.6 20h14.8a1.8 1.8 0 0 0 1.6-2.6L13.6 4.3a1.8 1.8 0 0 0-3.2 0z"/><path d="M12 9.5v4"/><path d="M12 16.6h.01"/></svg>
            </span>
            <div class="dash-kpi-body">
                <span class="dash-kpi-label">Defective GSM</span>
                <div class="dash-kpi-value">2</div>
                <div class="dash-sim-inline">
                    <span>Open</span> <strong>1</strong>
                    <span class="dash-sim-sep">|</span>
                    <span>In Repair</span> <strong>1</strong>
                </div>
            </div>
        </div>
        <div class="dash-kpi dash-kpi-sky" id="inbound-card">
            <span class="dash-kpi-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 16.9v2.3a1.7 1.7 0 0 1-1.9 1.7 16.8 16.8 0 0 1-7.3-2.6 16.5 16.5 0 0 1-5.1-5.1A16.8 16.8 0 0 1 3.1 5.9 1.7 1.7 0 0 1 4.8 4h2.3a1.7 1.7 0 0 1 1.7 1.5c.1.8.3 1.6.6 2.3a1.7 1.7 0 0 1-.4 1.8l-1 1a13.5 13.5 0 0 0 5.1 5.1l1-1a1.7 1.7 0 0 1 1.8-.4c.7.3 1.5.5 2.3.6A1.7 1.7 0 0 1 20 16.9z"/></svg>
            </span>
            <div class="dash-kpi-body">
                <span class="dash-kpi-label">Inbound Numbers</span>
                <div class="dash-kpi-value">9</div>
                <div class="dash-sim-inline">
                    <span>Mobile</span> <strong>7</strong>
                    <span class="dash-sim-sep">|</span>
                    <span>Landline</span> <strong>2</strong>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
